name: Collator monitor

on:
  schedule:
    - cron: '7 */2 * * *' # every 2 hours at minute 7 (avoids the top-of-hour cron rush)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collator-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run monitor (5 min telemetry listen window)
        env:
          NODES_CONFIG: ${{ secrets.NODES_CONFIG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check.mjs

      - name: Commit status.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update status.json [skip ci]"
            # retry with rebase: main may have moved while this run was listening (manual pushes, pages commits)
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $i) — rebase and retry"
              git pull --rebase origin main
              sleep $((i * 5))
            done
          fi
