<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collator Monitor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d0d0d;
  --bg2:     #1a1a1a;
  --bg3:     #242424;
  --bg4:     #2e2e2e;
  --border:  rgba(255,255,255,0.1);
  --border2: rgba(255,255,255,0.18);
  --text:    #f0ede8;
  --text2:   #a0a0a0;
  --text3:   #707070;
  --mono:    'JetBrains Mono', ui-monospace, monospace;
  --sans:    'DM Sans', system-ui, sans-serif;
  --green:   #4ade80;
  --green-d: #166534;
  --green-bg:#052e16;
  --red:     #f87171;
  --red-d:   #991b1b;
  --red-bg:  #2d0a0a;
  --amber:   #fbbf24;
  --amber-bg:#1c1200;
  --purple:  #a78bfa;
  --orange:  #fb923c;
  --blue:    #60a5fa;
  --radius:  8px;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

.topbar {
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; }
.logo span { color: var(--text3); margin: 0 6px; }
.indicator { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.indicator.live  { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 2s ease-in-out infinite; }
.indicator.error { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.topbar-right { font-family: var(--mono); font-size: 11px; color: var(--text3); text-align: right; line-height: 1.4; white-space: nowrap; }
.page { max-width: 860px; margin: 0 auto; padding: 24px 24px 64px; }

.stats {
  display: flex; gap: 1px; margin-bottom: 24px;
  background: var(--border); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.stat { flex: 1; padding: 14px 18px; background: var(--bg2); }
.stat.ok   { background: rgba(74, 222, 128, 0.03); }
.stat.bad  { background: rgba(248, 113, 113, 0.04); }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; white-space: nowrap; }
.stat-value { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); }

.section-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.cards { display: flex; flex-direction: column; gap: 14px; }

/* ── card ─────────────────────────────────────────────────────────────── */
.card {
  display: flex;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.card-edge-wrap {
  position: relative; width: 48px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-edge-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.card-edge-bg.relay-polkadot { background: linear-gradient(180deg, #ff2d8f 0%, #e6007a 55%, #a30052 100%); } /* official Polkadot pink #E6007A */
.card-edge-bg.relay-kusama  { background: linear-gradient(180deg, #333333 0%, #1a1a1a 55%, #0d0d0d 100%); }  /* Kusama black */
.card-edge-bg.relay-other   { background: linear-gradient(180deg, #64748b 0%, #475569 100%); }
.card-edge {
  position: relative; z-index: 1;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-family: var(--mono); font-size: 38px; font-weight: 900;
  letter-spacing: 0.08em; padding: 16px 0;
  user-select: none; text-transform: lowercase;
  color: rgba(255,255,255,0.88);
  text-shadow: 0 1px 3px rgba(0,0,0,0.55);
  white-space: nowrap;
}
.card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card-body {
  flex: 1; min-width: 0; padding: 16px 20px;
  background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%);
}
.card.status-offline { border-color: var(--red-d); }
.card.status-offline .card-body { background: linear-gradient(135deg, #1a1414 0%, #141010 100%); }
.card.status-stale, .card.status-error { border-color: rgba(251,191,36,0.3); }
.card.status-error .card-body { background: #161616; }

.card-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-label { font-size: 16px; font-weight: 600; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.chain-tag {
  display: inline-block;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 3px; letter-spacing: 0.03em;
  background: rgba(255,255,255,0.05); color: var(--text2);
  border: 1px solid rgba(255,255,255,0.08);
  white-space: nowrap;
}

.status-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; flex-shrink: 0;
}
.status-badge.online   { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-d); }
.status-badge.offline  { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-d); }
.status-badge.standby  { background: #0c1a2e;        color: var(--blue);   border: 1px solid #1e3a5f; }
.status-badge.stale    { background: var(--amber-bg); color: var(--amber); border: 1px solid #78350f; }
.status-badge.error    { background: var(--amber-bg); color: var(--amber); border: 1px solid #78350f; }

/* click-to-copy address */
.card-addr {
  font-family: var(--mono); font-size: 11px; color: var(--text3);
  word-break: break-all; flex: 1; min-width: 120px;
  cursor: pointer; padding: 2px 4px; margin: -2px -4px; border-radius: 4px;
  transition: color .15s, background .15s;
  position: relative;
}
.card-addr:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.card-addr.copied { color: var(--green); background: var(--green-bg); }
.copy-hint {
  position: absolute; right: 4px; top: -26px;
  background: var(--bg4); color: var(--text);
  font-size: 10px; font-family: var(--mono);
  padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border2);
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s;
}
.copy-hint.show { opacity: 1; }

/* meta grid */
.card-meta {
  display: grid; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 10px 16px;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meta-key {
  font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em;
  white-space: nowrap; cursor: default;
}
.meta-key.help { text-decoration: underline dotted var(--text3) 1px; text-underline-offset: 3px; }
.meta-val { font-family: var(--mono); font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.meta-val.highlight { color: var(--red); }
.meta-val.warn      { color: var(--amber); }
.meta-val.muted     { color: var(--text3); }

.card-error { margin-top: 8px; font-size: 12px; color: var(--amber); font-family: var(--mono); overflow-wrap: anywhere; }

/* tooltip (TtPB etc.) */
.tip {
  position: fixed; z-index: 100;
  background: var(--bg4); color: var(--text);
  border: 1px solid var(--border2); border-radius: 6px;
  padding: 8px 12px; font-size: 12px; font-family: var(--sans);
  max-width: 260px; line-height: 1.45;
  pointer-events: none; opacity: 0; transition: opacity .12s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.tip.show { opacity: 1; }

/* sparkline */
.sparkline { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.sparkline-label { font-family: var(--mono); font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.sparkline svg { display: block; width: 100%; height: 40px; }
.sparkline rect { pointer-events: all; }
.sparkline rect:hover { fill-opacity: 0.75; }

/* ── fullset toggle attached to card bottom ───────────────────────────── */
.fullset-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 8px 0;
  font-family: var(--mono); font-size: 10px; color: var(--text2);
  cursor: pointer; border: none;
  background: rgba(255,255,255,0.02);
  border-top: 1px solid rgba(255,255,255,0.06);
  letter-spacing: 0.03em;
  transition: background .15s;
}
.fullset-toggle:hover { background: rgba(255,255,255,0.05); color: var(--text); }
.fullset-toggle .arrow { font-size: 9px; display: inline-block; transition: transform .15s; }
.fullset-toggle.open .arrow { transform: rotate(90deg); }

.fullset-wrap { display: none; border-top: 1px solid rgba(255,255,255,0.04); background: #111; }
.fullset-wrap.open { display: block; }
.fullset-inner { max-height: 320px; overflow-y: auto; }
.fullset-inner::-webkit-scrollbar { width: 4px; }
.fullset-inner::-webkit-scrollbar-track { background: transparent; }
.fullset-inner::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

.fullset-table {
  width: 100%; font-family: var(--mono); font-size: 10.5px;
  border-collapse: collapse; table-layout: fixed;
}
.fullset-table th {
  font-size: 8px; color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.06em; padding: 5px 8px; font-weight: 400;
  text-align: right; position: sticky; top: 0; background: var(--bg3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.fullset-table th:nth-child(1) { width: 22px; text-align: left; }
.fullset-table th:nth-child(2) { text-align: left; width: 34%; }
.fullset-table th:nth-child(3) { text-align: left; width: 24%; }
.fullset-table td { padding: 3px 8px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fullset-table td:nth-child(1) { color: var(--text3); text-align: left; font-size: 9px; }
.fullset-table td:nth-child(2), .fullset-table td:nth-child(3) { text-align: left; }
.fullset-table td:nth-child(4), .fullset-table td:nth-child(5),
.fullset-table td:nth-child(6), .fullset-table td:nth-child(7) { text-align: right; font-variant-numeric: tabular-nums; }
.fullset-table tr.self td { color: var(--text); font-weight: 500; background: rgba(74,222,128,0.05); }
.fullset-table tr.stale td { color: var(--text3); font-style: italic; }
.fullset-table .lag { color: var(--red); }
.fullset-table .ok  { color: var(--text2); }
.fullset-hint { padding: 6px 10px; font-size: 9px; color: var(--text3); font-family: var(--mono); border-top: 1px solid rgba(255,255,255,0.04); }

.alert-banner { display: none; background: var(--red-bg); border: 1px solid var(--red-d); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 20px; color: var(--red); font-size: 13px; }
.alert-banner.show { display: block; }
.empty { text-align: center; padding: 60px 0; color: var(--text3); font-size: 13px; line-height: 1.8; }

.footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text3); font-family: var(--mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.footer a { color: inherit; text-decoration: underline; text-decoration-color: #444; }

.refresh-bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; margin-bottom: 20px; }
.refresh-bar-fill { height: 100%; background: var(--text3); transition: width 1s linear; }

/* ── mobile ───────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .topbar { padding: 0 14px; height: 46px; }
  .logo { font-size: 11px; }
  .topbar-right { font-size: 9px; }
  .page { padding: 14px 10px 48px; }

  .stats { flex-wrap: wrap; }
  .stat { flex: 1 1 44%; padding: 10px 14px; }
  .stat-value { font-size: 18px; }

  .card { flex-direction: column; }
  .card-edge-wrap { width: 100%; height: 26px; }
  .card-edge {
    writing-mode: horizontal-tb; transform: none;
    font-size: 13px; font-weight: 700; padding: 0 12px;
    letter-spacing: 0.14em; line-height: 26px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    text-align: left; white-space: nowrap; overflow: hidden;
  }
  .card-body { padding: 12px 14px; }
  .card-row { gap: 8px; }
  .card-label { font-size: 15px; flex: 1 1 100%; }
  .card-addr { font-size: 10px; flex: 1 1 100%; order: 3; min-width: 0; }
  .copy-hint { top: auto; bottom: -26px; right: 0; }
  .card-meta { grid-template-columns: repeat(3, 1fr); gap: 8px 10px; margin-top: 10px; padding-top: 10px; }
  .meta-val { font-size: 12px; white-space: normal; overflow-wrap: anywhere; }
  .fullset-table { font-size: 10px; }
  .fullset-table th:nth-child(3), .fullset-table td:nth-child(3) { display: none; }
  .fullset-inner { max-height: 260px; }
  .footer { flex-direction: column; gap: 4px; }
}

@media (max-width: 380px) {
  .card-meta { grid-template-columns: repeat(2, 1fr); }
  .stat { flex: 1 1 100%; padding: 8px 12px; display: flex; align-items: baseline; gap: 10px; }
  .stat-label { margin-bottom: 0; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">COLLATOR<span>/</span>MONITOR</div>
    <div class="indicator" id="liveIndicator"></div>
  </div>
  <div class="topbar-right" id="topbarMeta">loading&#8230;</div>
</div>

<div class="page">
  <div class="refresh-bar"><div class="refresh-bar-fill" id="refreshFill" style="width:100%"></div></div>
  <div class="alert-banner" id="alertBanner"></div>

  <div class="stats" id="statsRow">
    <div class="stat ok" id="statOnlineBox"><div class="stat-label">Online</div><div class="stat-value" id="statOnline">&ndash;</div></div>
    <div class="stat" id="statOfflineBox"><div class="stat-label">Offline</div><div class="stat-value" id="statOffline">&ndash;</div></div>
    <div class="stat" id="statChainsBox"><div class="stat-label">Chains</div><div class="stat-value" id="statChains">&ndash;</div></div>
  </div>

  <div class="section-label">Watched Collators</div>
  <div class="cards" id="cardList"><div class="empty">Loading status&hellip;</div></div>

  <div class="footer">
    <span>Source <a href="https://telemetry.polkadot.io/" target="_blank">wss://feed.telemetry.polkadot.io</a> &middot; Polkadot + Kusama ecosystem</span>
    <span><a href="https://github.com/yaronski/bulletin-collator-monitor" target="_blank">Source on GitHub</a> &middot; Updated by GitHub Actions every 2 hours</span>
  </div>
</div>

<div class="tip" id="tip"></div>

<script>
var REFRESH_MS = 5 * 60 * 1000;
var countdownInterval;
var TOOLTIPS = {
  ttpb: 'Block time: how long this node took to import its latest block (the telemetry feed field is the same the official frontend shows as "Block Time"). ~6 s is the normal Bulletin rhythm; values well above 10 s mean the node is falling behind.',
  peers: 'Number of libp2p peers currently connected. Fewer than ~5 usually means network problems.',
  stateSize: 'Size of the node\'s state cache (pruned) in memory.',
  upload: 'Average network upload while the check window ran.',
  download: 'Average network download while the check window ran.',
  spark: 'One bar per check interval: how many blocks the node produced/imported between two consecutive checks (~2 h apart). Green = normal progress (similar heights = steady production), amber = zero blocks in that window (node stuck or offline during it), red = best block went DOWN (node restarted on a shorter chain). Hover a bar for exact numbers.'
};

function fmt(iso) {
  if (!iso) return '\u2013';
  return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function ago(iso) {
  if (!iso) return '\u2013';
  var d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  return Math.floor(d/3600) + 'h ago';
}
function uptimeFrom(startupTime) {
  if (!startupTime) return '\u2013';
  var ms = Date.now() - startupTime;
  if (ms < 0) return '\u2013';
  var d = Math.floor(ms / 86400000);
  var h = Math.floor((ms % 86400000) / 3600000);
  if (d > 0) return d + 'd ' + h + 'h';
  var m = Math.floor((ms % 3600000) / 60000);
  return h + 'h ' + m + 'm';
}
function statusLabel(s) {
  return { online:'ONLINE', offline:'OFFLINE', stale:'STALE', error:'ERROR', standby:'STANDBY' }[s] || s.toUpperCase();
}
function fmtRate(bs) {
  if (bs == null) return '\u2013';
  if (bs >= 1048576) return (bs / 1048576).toFixed(1) + ' MiB/s';
  if (bs >= 1024) return (bs / 1024).toFixed(1) + ' KiB/s';
  return bs + ' B/s';
}
function fmtBytes(b) {
  if (b == null) return '\u2013';
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GiB';
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MiB';
  if (b >= 1024) return (b / 1024).toFixed(1) + ' KiB';
  return b + ' B';
}
function fmtPlanck(v) {
  if (v == null) return '\u2013';
  try {
    var n = BigInt(v);
    var unit = 1e12; // AssetHub/People planck (12 decimals)
    if (n >= unit) return (Number(n / BigInt(unit / 1000n)) / 1000).toLocaleString('en-US', {maximumFractionDigits: 2}) + ' UNIT';
    return n.toLocaleString('en-US') + ' planck';
  } catch (e) { return v; }
}
function relayOf(chainLabel) {
  if (/kusama/i.test(chainLabel)) return 'kusama';
  if (/polkadot/i.test(chainLabel)) return 'polkadot';
  return 'other';
}
function edgeWord(chainLabel) {
  var l = String(chainLabel || '').trim();
  var w = l.replace(/^polkadot\s+/i, '').replace(/^kusama\s+/i, '');
  return (w || l || 'chain').toLowerCase();
}
function setIndicator(state) { document.getElementById('liveIndicator').className = 'indicator ' + state; }

/* ── tooltip engine ─────────────────────────────────────────────────── */
(function () {
  var tip = document.getElementById('tip');
  var current = null;
  function show(text, x, y) {
    tip.textContent = text;
    tip.classList.add('show');
    var r = tip.getBoundingClientRect();
    var left = Math.max(8, Math.min(x - r.width / 2, window.innerWidth - r.width - 8));
    var top = y - r.height - 10;
    if (top < 8) top = y + 18;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hide() { tip.classList.remove('show'); current = null; }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest('[data-tip]');
    if (el && el !== current) { current = el; show(TOOLTIPS[el.getAttribute('data-tip')] || el.getAttribute('data-tip'), e.clientX, e.clientY); }
    else if (!el && current) hide();
  });
  document.addEventListener('mousemove', function (e) {
    if (current) { var r = tip.getBoundingClientRect(); var left = Math.max(8, Math.min(e.clientX - r.width / 2, window.innerWidth - r.width - 8)); var top = e.clientY - r.height - 10; if (top < 8) top = e.clientY + 18; tip.style.left = left + 'px'; tip.style.top = top + 'px'; }
  });
  document.addEventListener('mouseout', function (e) { if (current && !e.relatedTarget) hide(); });
  window.addEventListener('scroll', hide, true);
})();

// sparkline bars: custom hover tooltip (svg <title> is inconsistent/slow in browsers)
document.addEventListener('mouseover', function (e) {
  var bar = e.target.closest && e.target.closest('.sparkline rect[data-tip-raw]');
  if (!bar) return;
  var tip = document.getElementById('tip');
  tip.textContent = bar.getAttribute('data-tip-raw');
  tip.classList.add('show');
  var rc = bar.getBoundingClientRect();
  var tr = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(rc.left + rc.width / 2 - tr.width / 2, window.innerWidth - tr.width - 8)) + 'px';
  tip.style.top = Math.max(8, rc.top - tr.height - 10) + 'px';
});
document.addEventListener('mouseout', function (e) {
  if (e.target.closest && e.target.closest('.sparkline rect[data-tip-raw]')) {
    document.getElementById('tip').classList.remove('show');
  }
});

/* ── click-to-copy ──────────────────────────────────────────────────── */
function copyAddr(el, text) {
  var done = function () {
    el.classList.add('copied');
    var hint = el.querySelector('.copy-hint');
    if (hint) { hint.textContent = 'copied'; hint.classList.add('show'); }
    setTimeout(function () {
      el.classList.remove('copied');
      if (hint) { hint.classList.remove('show'); setTimeout(function(){ hint.textContent = 'click to copy'; }, 200); }
    }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function sparklineHtml(history) {
  if (!history || history.length < 2) return '';
  var pts = history.filter(function(h) { return h.best != null; }).map(function(h) { return { ts: new Date(h.ts).getTime(), best: h.best }; });
  if (pts.length < 2) return '';
  // one bar per check interval: blocks produced between consecutive checks
  var bars = [];
  for (var i = 1; i < pts.length; i++) {
    var delta = pts[i].best - pts[i-1].best;
    var gapH = Math.max(0.1, (pts[i].ts - pts[i-1].ts) / 3600000);
    bars.push({ delta: delta, perH: delta / gapH, gapH: gapH, ts: pts[i].ts });
  }
  var W = 600, H = 40, PAD = 3;
  var maxAbs = Math.max.apply(null, bars.map(function(b) { return Math.abs(b.delta); })) || 1;
  var bw = (W - 2 * PAD) / bars.length;
  var rects = bars.map(function(b, i) {
    var hPct = Math.abs(b.delta) / maxAbs;
    var h = Math.max(2, hPct * (H - 8));
    var x = PAD + i * bw;
    var stalled = b.delta === 0;
    var dropped = b.delta < 0;
    var fill = stalled ? '#78350f' : dropped ? '#991b1b' : '#4ade80';
    var tipTxt = (b.delta >= 0 ? '+' : '') + b.delta.toLocaleString('en-US') + ' blocks in ' + b.gapH.toFixed(1) + 'h \u2192 ' + Math.round(b.perH).toLocaleString('en-US') + '/h \u00b7 ' + new Date(b.ts).toLocaleString();
    return '<rect x="' + x.toFixed(1) + '" y="' + (H - PAD - h).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1" fill="' + fill + '" data-tip-raw="' + escapeHtml(tipTxt) + '"></rect>';
  }).join('');
  var last = pts[pts.length-1].best;
  var avgPerH = Math.round(bars.reduce(function(a, b) { return a + b.perH; }, 0) / bars.length);
  return '<div class="sparkline">'
    + '<div class="sparkline-label" data-tip="spark">Blocks per check \u00b7 avg ' + avgPerH.toLocaleString('en-US') + '/h \u00b7 last ' + last.toLocaleString('en-US') + '</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + rects + '</svg></div>';
}

function renderStats(nodes, chains) {
  var v = Object.values(nodes);
  var on = v.filter(function(c) { return c.statusText === 'online'; }).length;
  var off = v.filter(function(c) { return c.statusText === 'offline'; }).length; // real state (incl. expected 'missing')
  var err = v.filter(function(c) { return c.statusText === 'error' || c.statusText === 'stale'; }).length;
  document.getElementById('statOnline').textContent = on;
  document.getElementById('statOffline').textContent = off;
  document.getElementById('statChains').textContent = Object.keys(chains).length;
  document.getElementById('statOnlineBox').className = 'stat' + (on > 0 ? ' ok' : '');
  document.getElementById('statOfflineBox').className = 'stat' + ((off + err) > 0 ? ' bad' : '');
}

function metaItem(key, tipKey, valHtml, cls) {
  return '<div class="meta-item"><div class="meta-key' + (tipKey ? ' help' : '') + '"' + (tipKey ? ' data-tip="' + tipKey + '"' : '') + '>' + key + '</div><div class="meta-val ' + (cls || '') + '">' + valHtml + '</div></div>';
}

function renderCards(nodes, chains) {
  var list = document.getElementById('cardList');
  var entries = Object.entries(nodes);
  if (!entries.length) {
    list.innerHTML = '<div class="empty">No nodes in status.json yet.<br>Add nodes to config.json / NODES_CONFIG and run the GitHub Actions workflow.</div>';
    return;
  }
  var statusOrder = { offline:0, stale:1, error:2, standby:3, online:4 };
  entries.sort(function(a,b) {
    var ca = String(a[1].chain || ''), cb = String(b[1].chain || '');
    if (ca !== cb) return ca.localeCompare(cb);
    var sa = statusOrder.hasOwnProperty(a[1].statusText) ? statusOrder[a[1].statusText] : 9;
    var sb = statusOrder.hasOwnProperty(b[1].statusText) ? statusOrder[b[1].statusText] : 9;
    return sa - sb;
  });

  list.innerHTML = entries.map(function(pair) {
    var key = pair[0], col = pair[1];
    var st = col.statusText || 'error';
    var label = col.label || col.name || 'node';
    var relay = relayOf(col.chain);
    var chainInfo = col.chain ? (chains[col.chain] || null) : null;
    var id = 'fs-' + key.replace(/[^a-z0-9]/gi, '');

    // watched nodes in this chain's fullset (by peerId or raw-address match via name)
    var watchedIds = {};
    Object.values(nodes).forEach(function(n) {
      if (n.chain === col.chain && n.peerId) watchedIds[n.peerId] = true;
    });

    var meta = '';
    meta += metaItem('Best block', null, col.best != null ? col.best.toLocaleString('en-US') : '\u2013');
    meta += metaItem('Finalized', null, col.finalized != null ? col.finalized.toLocaleString('en-US') : '\u2013');
    meta += metaItem('Peers', 'peers', col.peers != null ? col.peers : '\u2013', col.peers != null && col.peers < 5 ? 'warn' : '');
    if (col.chainStatus) meta += metaItem('Collator set', null, escapeHtml(col.chainStatus) + (col.invulnerable ? ' \u00b7 invuln' : ''), (col.chainStatus === 'missing' || col.chainStatus === 'inactive') ? 'highlight' : (col.chainStatus === 'standby' ? 'muted' : ''));
    if (col.deposit) meta += metaItem('Bond', null, escapeHtml(fmtPlanck(col.deposit)));
    if (col.ttpb != null) meta += metaItem('Block time', 'ttpb', (col.ttpb / 1000).toFixed(1) + 's', col.ttpb > 10000 ? 'warn' : '');
    if (col.uploadAvgBs != null) meta += metaItem('Upload', 'upload', fmtRate(col.uploadAvgBs));
    if (col.downloadAvgBs != null) meta += metaItem('Download', 'download', fmtRate(col.downloadAvgBs));
    if (col.stateSize != null && col.stateSize > 0) meta += metaItem('State cache', 'stateSize', fmtBytes(col.stateSize));
    if (col.version) meta += metaItem('Version', null, '<span title="' + escapeHtml(col.version) + '">' + escapeHtml(col.version.split('-')[0].slice(0, 12)) + '</span>');
    if (col.startupTime) meta += metaItem('Uptime', null, uptimeFrom(col.startupTime));
    if (col.consecutiveOffline > 0) meta += metaItem('Consec. offline', null, String(col.consecutiveOffline), 'highlight');

    var addrText = col.address || col.peerId || col.name || '';
    var addrHtml = addrText
      ? '<div class="card-addr" onclick="copyAddr(this, ' + JSON.stringify(addrText) + ')" title="click to copy"><span class="copy-hint">click to copy</span>' + escapeHtml(col.address ? addrText : addrText) + '</div>'
      : '';

    var fullsetHtml = '';
    if (chainInfo && (chainInfo.nodesTable || []).length) {
      var t = chainInfo.nodesTable;
      var best = t.length ? t[0].best || 0 : 0;
      var rows = t.map(function(n) {
        var lag = best - (n.best || 0);
        var lagCell = lag <= 1 ? '<span class="ok">' + lag + '</span>' : '<span class="lag">-' + lag.toLocaleString('en-US') + '</span>';
        var isWatched = watchedIds[n.peerId];
        return '<tr class="' + (isWatched ? 'self' : '') + (n.stale ? ' stale' : '') + '">'
          + '<td>' + (isWatched ? '\u2605' : '') + '</td>'
          + '<td title="' + escapeHtml(n.name || '') + '">' + escapeHtml(n.name || '\u2013') + (n.stale ? ' (stale)' : '') + '</td>'
          + '<td title="' + escapeHtml(n.peerId || '') + '">' + escapeHtml(n.peerId || '\u2013') + '</td>'
          + '<td>' + (n.best != null ? n.best.toLocaleString('en-US') : '\u2013') + '</td>'
          + '<td>' + (n.finalized != null ? n.finalized.toLocaleString('en-US') : '\u2013') + '</td>'
          + '<td>' + (n.peers != null ? n.peers : '\u2013') + '</td>'
          + '<td>' + lagCell + '</td>'
          + '</tr>';
      }).join('');
      fullsetHtml = '<button class="fullset-toggle" onclick="toggleFullset(\'' + id + '\', this)">'
        + '<span class="arrow">\u25B8</span>'
        + '<span class="tog-text">all ' + t.length + ' nodes on ' + escapeHtml(edgeWord(col.chain)) + ' telemetry</span>'
        + '</button>'
        + '<div class="fullset-wrap" id="' + id + '"><div class="fullset-inner">'
        + '<table class="fullset-table">'
        + '<thead><tr><th></th><th style="text-align:left">Node</th><th style="text-align:left">PeerID</th><th>Best</th><th>Final</th><th>Peers</th><th>Lag</th></tr></thead>'
        + '<tbody>' + rows + '</tbody></table>'
        + '<div class="fullset-hint">telemetry shows every reporting node (RPC nodes included) - hover a PeerID for the full value</div>'
        + '</div></div>';

    // on-chain collator table (real sets from chain storage - telemetry cannot filter collators)
    var cid = 'cs-' + key.replace(/[^a-z0-9]/gi, '');
    if (chainInfo && (chainInfo.activeSet || chainInfo.candidateSet || chainInfo.invulnerableSet)) {
      var watchedAddrs = {};
      Object.values(nodes).forEach(function(n) { if (n.chain === col.chain && n.address) watchedAddrs[n.address] = true; });
      var activeList = chainInfo.activeSet || [];
      var invulnList = chainInfo.invulnerableSet || [];
      var candList = chainInfo.candidateSet || [];
      var candByAddr = {};
      candList.forEach(function(c) { candByAddr[c.address] = c; });
      var setRows = [];
      activeList.forEach(function(addr) {
        var isInv = invulnList.indexOf(addr) >= 0;
        var isWatched = !!watchedAddrs[addr];
        setRows.push({ addr: addr, role: 'active' + (isInv ? ' \u00b7 invulnerable' : ''), watched: isWatched, deposit: null });
      });
      invulnList.forEach(function(addr) {
        if (activeList.indexOf(addr) >= 0) return;
        setRows.push({ addr: addr, role: 'invulnerable (standby)', watched: !!watchedAddrs[addr], deposit: null });
      });
      candList.forEach(function(c) {
        if (activeList.indexOf(c.address) >= 0 || invulnList.indexOf(c.address) >= 0) return;
        setRows.push({ addr: c.address, role: 'candidate (standby)', watched: !!watchedAddrs[c.address], deposit: c.deposit });
      });
      setRows.sort(function(a2, b2) { return (b2.watched - a2.watched) || a2.role.localeCompare(b2.role); });
      var setRowsHtml = setRows.map(function(r2) {
        return '<tr class="' + (r2.watched ? 'self' : '') + '">'
          + '<td>' + (r2.watched ? '\u2605' : '') + '</td>'
          + '<td title="' + escapeHtml(r2.addr) + '" style="cursor:pointer" onclick="copyAddr(this, ' + JSON.stringify(r2.addr).replace(/"/g, '&quot;') + ')">' + escapeHtml(r2.addr.slice(0, 8)) + '\u2026' + escapeHtml(r2.addr.slice(-6)) + '</td>'
          + '<td>' + escapeHtml(r2.role) + '</td>'
          + '<td>' + (r2.deposit ? escapeHtml(fmtPlanck(r2.deposit)) : '\u2013') + '</td>'
          + '</tr>';
      }).join('');
      fullsetHtml += '<button class="fullset-toggle" onclick="toggleFullset(\'' + cid + '\', this)">'
        + '<span class="arrow">\u25B8</span>'
        + '<span class="tog-text">on-chain collator set (' + setRows.length + ')</span>'
        + '</button>'
        + '<div class="fullset-wrap" id="' + cid + '"><div class="fullset-inner">'
        + '<table class="fullset-table">'
        + '<thead><tr><th style="width:22px"></th><th style="text-align:left">Address</th><th style="text-align:left">Role</th><th>Bond</th></tr></thead>'
        + '<tbody>' + setRowsHtml + '</tbody></table>'
        + '<div class="fullset-hint">from Session.Validators / CollatorSelection storage · click an address to copy</div>'
        + '</div></div>';
    }
    }

    return '<div class="card status-' + st + '">'
      + '<div class="card-edge-wrap"><div class="card-edge-bg relay-' + relay + '"></div><div class="card-edge">' + edgeWord(col.chain) + '</div></div>'
      + '<div class="card-main">'
      + '<div class="card-body">'
      + '<div class="card-row">'
      + '<div class="card-label">' + escapeHtml(label) + '</div>'
      + '<span class="chain-tag">' + escapeHtml(col.chain || '') + '</span>'
      + '<span class="status-badge ' + st + '">' + statusLabel(st) + '</span>'
      + '</div>'
      + (addrHtml ? '<div class="card-row" style="margin-top:6px">' + addrHtml + '</div>' : '')
      + '<div class="card-meta">' + meta + '</div>'
      + sparklineHtml(col.history)
      + (col.lastError ? '<div class="card-error">\u2717 ' + escapeHtml(col.lastError) + '</div>' : '')
      + '</div>'
      + fullsetHtml
      + '</div>'
      + '</div>';
  }).join('');
}

function toggleFullset(id, btn) {
  var wrap = document.getElementById(id);
  var open = !wrap.classList.contains('open');
  // save the original label BEFORE overwriting it with 'hide'
  if (!btn.getAttribute('data-label')) btn.setAttribute('data-label', btn.querySelector('.tog-text').textContent);
  wrap.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  btn.querySelector('.tog-text').textContent = open ? 'hide' : btn.getAttribute('data-label');
}

function shortPeer(p) { return p ? p.slice(0, 10) + '\u2026' + p.slice(-4) : '\u2013'; }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderAlert(nodes, feed) {
  var banner = document.getElementById('alertBanner');
  // only nodes whose alerts are enabled (alerts !== false in config) belong in the alarm banner;
  // e.g. upcoming candidates are expected to be 'missing' until their referendum passes
  var offline = Object.values(nodes).filter(function(c) { return c.statusText === 'offline' && c.alertsEnabled !== false; });
  if (feed && feed.error) {
    banner.innerHTML = '\u26A0 Telemetry feed problem: ' + escapeHtml(feed.error) + ' — offline detection paused.';
    banner.classList.add('show');
    return;
  }
  if (!offline.length) { banner.classList.remove('show'); return; }
  var names = offline.map(function(c) { return '<strong>' + escapeHtml(c.label || c.peerId) + '</strong> (' + escapeHtml(c.chain || '') + ')'; }).join(', ');
  banner.innerHTML = '\u26A0 ' + offline.length + ' node' + (offline.length > 1 ? 's are' : ' is') + ' OFFLINE: ' + names;
  banner.classList.add('show');
}

async function load() {
  try {
    var res = await fetch('status.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var nodes = data.nodes || {};
    var chains = data.chains || {};
    setIndicator(data.feed && data.feed.error ? 'error' : 'live');
    document.getElementById('topbarMeta').innerHTML =
      'Updated ' + ago(data.lastUpdated) + '<br>' + fmt(data.lastUpdated);
    renderStats(nodes, chains);
    renderCards(nodes, chains);
    renderAlert(nodes, data.feed);
  } catch (err) {
    setIndicator('error');
    document.getElementById('topbarMeta').textContent = 'fetch error';
    document.getElementById('cardList').innerHTML = '<div class="empty">Could not load status.json<br><span style="color:var(--amber);font-family:var(--mono);font-size:11px">' + err.message + '</span></div>';
  }
}

function startRefreshCycle() {
  clearInterval(countdownInterval);
  var sec = REFRESH_MS / 1000;
  var fill = document.getElementById('refreshFill');
  fill.style.width = '100%';
  countdownInterval = setInterval(function() {
    sec--;
    fill.style.width = Math.max(0, (sec / (REFRESH_MS / 1000)) * 100) + '%';
    if (sec <= 0) { clearInterval(countdownInterval); load().then(startRefreshCycle); }
  }, 1000);
}

load().then(startRefreshCycle);
</script>
</body>
</html>
