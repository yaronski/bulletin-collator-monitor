<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collator Monitor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d0d0d;
  --bg2:     #1a1a1a;
  --bg3:     #242424;
  --bg4:     #2e2e2e;
  --border:  rgba(255,255,255,0.1);
  --border2: rgba(255,255,255,0.18);
  --text:    #f0ede8;
  --text2:   #a0a0a0;
  --text3:   #707070;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'DM Sans', system-ui, sans-serif;
  --green:   #4ade80;
  --green-d: #166534;
  --green-bg:#052e16;
  --red:     #f87171;
  --red-d:   #991b1b;
  --red-bg:  #2d0a0a;
  --amber:   #fbbf24;
  --amber-bg:#1c1200;
  --purple:  #a78bfa;
  --orange:  #fb923c;
  --pink-v:  #e6007a;
  --pink-d:  #9d0b4c;
  --radius:  8px;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
  line-height: 1.5;
}

.topbar {
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; }
.logo span { color: var(--text3); margin: 0 6px; }
.indicator { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.indicator.live  { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 2s ease-in-out infinite; }
.indicator.error { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.topbar-right { font-family: var(--mono); font-size: 11px; color: var(--text3); text-align: right; line-height: 1.4; }
.page { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }

.stats {
  display: flex; gap: 1px; margin-bottom: 28px;
  background: var(--border); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.stat { flex: 1; padding: 14px 18px; background: var(--bg2); }
.stat.ok   { background: rgba(74, 222, 128, 0.03); }
.stat.bad  { background: rgba(248, 113, 113, 0.04); }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.stat-value { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); }

.section-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.cards { display: flex; flex-direction: column; gap: 14px; }

.card {
  display: flex;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.card-edge-wrap {
  position: relative; width: 52px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-edge-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.card-edge-bg.relay-polkadot { background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); }
.card-edge-bg.relay-kusama  { background: linear-gradient(180deg, #f97316 0%, #ea580c 100%); }
.card-edge-bg.relay-other   { background: linear-gradient(180deg, #64748b 0%, #475569 100%); }
.card-edge {
  position: relative; z-index: 1;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-family: var(--mono); font-size: 42px; font-weight: 900;
  letter-spacing: 0.08em;
  padding: 16px 0;
  user-select: none;
  text-transform: lowercase;
  color: rgba(0,0,0,0.7);
}
.card-body {
  flex: 1; min-width: 0; padding: 18px 22px;
  background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%);
}
.card.status-offline { border-color: var(--red-d); }
.card.status-offline .card-body { background: linear-gradient(135deg, #1a1414 0%, #141010 100%); }
.card.status-offline .card-edge-bg.relay-polkadot { background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%); }
.card.status-offline .card-edge-bg.relay-kusama  { background: linear-gradient(180deg, #ea080c 0%, #c2410c 100%); }
.card.status-offline .card-edge-bg.relay-other   { background: linear-gradient(180deg, #475569 0%, #334155 100%); }
.card.status-stale { border-color: rgba(251,191,36,0.3); }
.card.status-error { border-color: rgba(251,191,36,0.25); }
.card.status-error .card-body { background: #161616; }

.card-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-label { font-size: 16px; font-weight: 600; color: var(--text); }
.card-addr { font-family: var(--mono); font-size: 11px; color: var(--text3); word-break: break-all; flex: 1; min-width: 0; }

.card-rank { font-family: var(--mono); font-size: 12px; color: var(--text3); flex-shrink: 0; letter-spacing: 0.02em; }
.card-rank .rank-num { font-size: 16px; font-weight: 700; color: var(--text); }

.status-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 3px 10px; border-radius: 3px; letter-spacing: 0.04em; flex-shrink: 0;
}
.status-badge.online   { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-d); }
.status-badge.offline  { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-d); }
.status-badge.stale    { background: var(--amber-bg); color: var(--amber); border: 1px solid #78350f; }
.status-badge.error    { background: var(--amber-bg); color: var(--amber); border: 1px solid #78350f; }

.card-meta {
  display: flex; gap: 20px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border); flex-wrap: wrap;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-key { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; }
.meta-val { font-family: var(--mono); font-size: 13px; color: var(--text); }
.meta-val.highlight { color: var(--red); }
.meta-val.warn      { color: var(--amber); }
.meta-val.muted     { color: var(--text3); }

.chain-tag {
  display: inline-block;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 3px; letter-spacing: 0.03em;
  background: rgba(255,255,255,0.05); color: var(--text2);
  border: 1px solid rgba(255,255,255,0.08);
}

.card-error { margin-top: 8px; font-size: 12px; color: var(--amber); font-family: var(--mono); }

.sparkline { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.sparkline-label { font-family: var(--mono); font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.sparkline svg { display: block; width: 100%; height: 36px; }

.nodes-section { margin-top: 28px; }
.chain-block { margin-bottom: 18px; }
.chain-head {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 12px; color: var(--text2);
  padding: 8px 0 6px;
}
.chain-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.chain-dot.relay-polkadot { background: var(--purple); }
.chain-dot.relay-kusama  { background: var(--orange); }
.chain-dot.relay-other   { background: #64748b; }
.chain-count { color: var(--text3); font-size: 10px; }

.fullset-btn {
  display: block; width: 100%; margin-top: 8px;
  font-family: var(--mono); font-size: 10px; color: var(--text2);
  cursor: pointer; padding: 6px 0; border: none; background: none;
  text-align: center; letter-spacing: 0.03em;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.fullset-btn:hover { color: var(--text); }

.fullset-wrap {
  display: none; margin-top: 8px;
  max-height: 360px; overflow-y: auto;
  border: 1px solid rgba(255,255,255,0.06); border-radius: 4px;
}
.fullset-wrap::-webkit-scrollbar { width: 4px; }
.fullset-wrap::-webkit-scrollbar-track { background: transparent; }
.fullset-wrap::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

.fullset-table {
  width: 100%; font-family: var(--mono); font-size: 10px;
  border-collapse: collapse; table-layout: fixed;
}
.fullset-table th {
  font-size: 8px; color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.06em; padding: 4px 6px; font-weight: 400;
  text-align: right; position: sticky; top: 0; background: var(--bg3);
  border-bottom: 1px solid var(--border);
}
.fullset-table th:nth-child(1) { width: 26px; text-align: left; }
.fullset-table th:nth-child(2) { text-align: left; }
.fullset-table th:nth-child(3) { text-align: left; }
.fullset-table td { padding: 2px 6px; vertical-align: middle; }
.fullset-table td:nth-child(1) { color: var(--text3); text-align: left; font-size: 9px; }
.fullset-table td:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fullset-table td:nth-child(3) { color: var(--text3); font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fullset-table td:nth-child(4), .fullset-table td:nth-child(5),
.fullset-table td:nth-child(6), .fullset-table td:nth-child(7) { text-align: right; white-space: nowrap; }
.fullset-table tr.self td { color: var(--text); font-weight: 500; background: rgba(74,222,128,0.05); }
.fullset-table tr.stale td { color: var(--text3); font-style: italic; }
.fullset-table .lag { color: var(--red); }
.fullset-table .ok  { color: var(--text2); }

.alert-banner { display: none; background: var(--red-bg); border: 1px solid var(--red-d); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 20px; color: var(--red); font-size: 13px; }
.alert-banner.show { display: block; }
.alert-banner strong { font-weight: 500; }
.empty { text-align: center; padding: 60px 0; color: var(--text3); font-size: 13px; line-height: 1.8; }

.footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text3); font-family: var(--mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.footer a { color: inherit; text-decoration: underline; text-decoration-color: #444; }

.refresh-bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; margin-bottom: 20px; }
.refresh-bar-fill { height: 100%; background: var(--text3); transition: width 1s linear; }

@media (max-width: 640px) {
  .topbar { padding: 0 16px; height: 48px; }
  .page { padding: 20px 14px 48px; }
  .card-body { padding: 14px 16px; }
  .card-edge-wrap { width: 36px; }
  .card-edge { font-size: 28px; }
  .card-row { gap: 8px; }
  .card-addr { font-size: 10px; }
  .card-meta { gap: 14px; }
  .meta-val { font-size: 12px; }
  .fullset-table { font-size: 9px; }
  .fullset-table td, .fullset-table th { white-space: normal; word-break: break-word; }
  .stats { flex-direction: column; }
  .stat { padding: 10px 14px; }
  .stat-value { font-size: 18px; }
  .footer { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">COLLATOR<span>/</span>MONITOR</div>
    <div class="indicator" id="liveIndicator"></div>
  </div>
  <div class="topbar-right" id="topbarMeta">loading&#8230;</div>
</div>

<div class="page">
  <div class="refresh-bar"><div class="refresh-bar-fill" id="refreshFill" style="width:100%"></div></div>
  <div class="alert-banner" id="alertBanner"></div>

  <div class="stats" id="statsRow">
    <div class="stat ok" id="statOnlineBox"><div class="stat-label">Online</div><div class="stat-value" id="statOnline">&ndash;</div></div>
    <div class="stat" id="statOfflineBox"><div class="stat-label">Offline</div><div class="stat-value" id="statOffline">&ndash;</div></div>
    <div class="stat" id="statChainsBox"><div class="stat-label">Chains</div><div class="stat-value" id="statChains">&ndash;</div></div>
    <div class="stat" id="statNodesBox"><div class="stat-label">Nodes seen</div><div class="stat-value" id="statNodes">&ndash;</div></div>
  </div>

  <div class="section-label">Watched Collators</div>
  <div class="cards" id="cardList"><div class="empty">Loading status&hellip;</div></div>

  <div class="nodes-section">
    <div class="section-label">All nodes on telemetry</div>
    <div id="nodesTableWrap"><div class="empty">Loading&hellip;</div></div>
  </div>

  <div class="footer">
    <span>Source <a href="https://telemetry.polkadot.io/" target="_blank">wss://feed.telemetry.polkadot.io</a> &middot; Polkadot + Kusama ecosystem</span>
    <span><a href="https://github.com/yaronski/bulletin-collator-monitor" target="_blank">Source on GitHub</a> &middot; Updated by GitHub Actions every hour</span>
  </div>
</div>

<script>
var REFRESH_MS = 5 * 60 * 1000;
var countdownInterval;
var expandedChains = {};

function fmt(iso) {
  if (!iso) return '\u2013';
  return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function ago(iso) {
  if (!iso) return '\u2013';
  var d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  return Math.floor(d/3600) + 'h ago';
}
function uptimeFrom(startupTime) {
  if (!startupTime) return '\u2013';
  var ms = Date.now() - startupTime;
  if (ms < 0) return '\u2013';
  var d = Math.floor(ms / 86400000);
  var h = Math.floor((ms % 86400000) / 3600000);
  if (d > 0) return d + 'd ' + h + 'h';
  var m = Math.floor((ms % 3600000) / 60000);
  return h + 'h ' + m + 'm';
}
function statusLabel(s) {
  return { online:'ONLINE', offline:'OFFLINE', stale:'STALE', error:'ERROR' }[s] || s.toUpperCase();
}
function fmtRate(bs) {
  if (bs == null) return '\u2013';
  if (bs >= 1048576) return (bs / 1048576).toFixed(1) + ' MiB/s';
  if (bs >= 1024) return (bs / 1024).toFixed(1) + ' KiB/s';
  return bs + ' B/s';
}
function fmtBytes(b) {
  if (b == null) return '\u2013';
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GiB';
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MiB';
  if (b >= 1024) return (b / 1024).toFixed(1) + ' KiB';
  return b + ' B';
}
function relayOf(chainLabel) {
  if (/kusama/i.test(chainLabel)) return 'kusama';
  if (/polkadot/i.test(chainLabel)) return 'polkadot';
  return 'other';
}
function edgeWord(relay) {
  // vertical card edge label
  if (relay === 'kusama') return 'kusama';
  if (relay === 'polkadot') return 'polkadot';
  return 'chain';
}
function setIndicator(state) { document.getElementById('liveIndicator').className = 'indicator ' + state; }

function sparklineHtml(history) {
  if (!history || history.length < 2) return '';
  var pts = history.filter(function(h) { return h.best != null; }).map(function(h) { return { ts: new Date(h.ts).getTime(), best: h.best }; });
  if (pts.length < 2) return '';
  var W = 600, H = 36, PAD = 2;
  var minB = Math.min.apply(null, pts.map(function(p) { return p.best; }));
  var maxB = Math.max.apply(null, pts.map(function(p) { return p.best; }));
  var minT = pts[0].ts, maxT = pts[pts.length-1].ts;
  if (maxT === minT || maxB === minB) return '';
  var path = pts.map(function(p, i) {
    var x = PAD + ((p.ts - minT) / (maxT - minT)) * (W - 2*PAD);
    var y = H - PAD - ((p.best - minB) / (maxB - minB)) * (H - 2*PAD);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  return '<div class="sparkline">'
    + '<div class="sparkline-label">Best block \u00b7 last ' + pts.length + ' checks</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + '<path d="' + path + '" fill="none" stroke="#4ade80" stroke-width="1.5"/>'
    + '</svg></div>';
}

function renderStats(nodes, chains) {
  var v = Object.values(nodes);
  var on = v.filter(function(c) { return c.statusText === 'online'; }).length;
  var off = v.filter(function(c) { return c.statusText === 'offline'; }).length;
  var err = v.filter(function(c) { return c.statusText === 'error' || c.statusText === 'stale'; }).length;
  var nodesSeen = Object.values(chains).reduce(function(a, c) { return a + (c.nodeCount || 0); }, 0);
  document.getElementById('statOnline').textContent = on;
  document.getElementById('statOffline').textContent = off;
  document.getElementById('statChains').textContent = Object.keys(chains).length;
  document.getElementById('statNodes').textContent = nodesSeen;
  document.getElementById('statOnlineBox').className = 'stat' + (on > 0 ? ' ok' : '');
  document.getElementById('statOfflineBox').className = 'stat' + ((off + err) > 0 ? ' bad' : '');
}

function renderCards(nodes) {
  var list = document.getElementById('cardList');
  var entries = Object.values(nodes);
  if (!entries.length) {
    list.innerHTML = '<div class="empty">No nodes in status.json yet.<br>Add nodes to config.json / NODES_CONFIG and run the GitHub Actions workflow.</div>';
    return;
  }
  var statusOrder = { offline:0, stale:1, error:2, online:3 };
  entries.sort(function(a,b) {
    var ca = String(a.chain || ''), cb = String(b.chain || '');
    if (ca !== cb) return ca.localeCompare(cb);
    var sa = statusOrder.hasOwnProperty(a.statusText) ? statusOrder[a.statusText] : 9;
    var sb = statusOrder.hasOwnProperty(b.statusText) ? statusOrder[b.statusText] : 9;
    return sa - sb;
  });

  list.innerHTML = entries.map(function(col) {
    var st = col.statusText || 'error';
    var label = col.label || col.name || 'node';
    var relay = relayOf(col.chain);
    var consec = col.consecutiveOffline > 0
      ? '<div class="meta-item"><div class="meta-key">Consec. offline</div><div class="meta-val highlight">' + col.consecutiveOffline + '</div></div>'
      : '';
    var ttpb = col.ttpb != null
      ? '<div class="meta-item"><div class="meta-key">TtPB</div><div class="meta-val ' + (col.ttpb > 6000 ? 'warn' : '') + '">' + (col.ttpb / 1000).toFixed(1) + 's</div></div>'
      : '';
    var upload = col.uploadAvgBs != null
      ? '<div class="meta-item"><div class="meta-key">Upload avg</div><div class="meta-val">' + fmtRate(col.uploadAvgBs) + '</div></div>'
      : '';
    var download = col.downloadAvgBs != null
      ? '<div class="meta-item"><div class="meta-key">Download avg</div><div class="meta-val">' + fmtRate(col.downloadAvgBs) + '</div></div>'
      : '';
    var stateSize = col.stateSize != null && col.stateSize > 0
      ? '<div class="meta-item"><div class="meta-key">State cache</div><div class="meta-val">' + fmtBytes(col.stateSize) + '</div></div>'
      : '';
    var peersCls = col.peers != null && col.peers < 5 ? 'warn' : '';

    return '<div class="card status-' + st + ' relay-' + relay + '">'
      + '<div class="card-edge-wrap"><div class="card-edge-bg relay-' + relay + '"></div><div class="card-edge">' + edgeWord(relay) + '</div></div>'
      + '<div class="card-body">'
      + '<div class="card-row">'
      + '<div class="card-label">' + escapeHtml(label) + '</div>'
      + '<span class="chain-tag">' + escapeHtml(col.chain || '') + '</span>'
      + '<div class="card-addr">' + escapeHtml(col.peerId || col.name || '') + '</div>'
      + '<span class="status-badge ' + st + '">' + statusLabel(st) + '</span>'
      + '</div>'
      + '<div class="card-meta">'
      + '<div class="meta-item"><div class="meta-key">Best block</div><div class="meta-val">' + (col.best != null ? col.best.toLocaleString() : '\u2013') + '</div></div>'
      + '<div class="meta-item"><div class="meta-key">Finalized</div><div class="meta-val">' + (col.finalized != null ? col.finalized.toLocaleString() : '\u2013') + '</div></div>'
      + '<div class="meta-item"><div class="meta-key">Peers</div><div class="meta-val ' + peersCls + '">' + (col.peers != null ? col.peers : '\u2013') + '</div></div>'
      + ttpb + upload + download + stateSize
      + '<div class="meta-item"><div class="meta-key">Version</div><div class="meta-val">' + escapeHtml(col.version || '\u2013') + '</div></div>'
      + '<div class="meta-item"><div class="meta-key">Uptime</div><div class="meta-val">' + uptimeFrom(col.startupTime) + '</div></div>'
      + consec
      + '</div>'
      + sparklineHtml(col.history)
      + (col.lastError ? '<div class="card-error">\u2717 ' + escapeHtml(col.lastError) + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

function renderNodesTable(chains, watched) {
  var wrap = document.getElementById('nodesTableWrap');
  var chainNames = Object.keys(chains);
  if (!chainNames.length) {
    wrap.innerHTML = '<div class="empty">No telemetry chains in status.json yet.</div>';
    return;
  }
  var watchedIds = {};
  Object.values(watched).forEach(function(n) { if (n.peerId) watchedIds[n.peerId] = true; });

  wrap.innerHTML = chainNames.map(function(label) {
    var c = chains[label];
    var relay = c.relay || relayOf(label);
    var key = 'chain-' + label.replace(/[^a-z0-9]/gi, '');
    var isExp = !!expandedChains[key];
    var t = c.nodesTable || [];
    var best = t.length ? t[0].best || 0 : 0;

    var rows = t.map(function(n) {
      var lag = best - (n.best || 0);
      var lagCell = lag <= 1 ? '<span class="ok">' + lag + '</span>' : '<span class="lag">-' + lag.toLocaleString() + '</span>';
      var isWatched = watchedIds[n.peerId];
      return '<tr class="' + (isWatched ? 'self' : '') + (n.stale ? ' stale' : '') + '">'
        + '<td>' + (isWatched ? '\u2605' : '') + '</td>'
        + '<td>' + escapeHtml(n.name || '\u2013') + (n.stale ? ' (stale)' : '') + '</td>'
        + '<td title="' + escapeHtml(n.peerId || '') + '">' + escapeHtml(shortPeer(n.peerId)) + '</td>'
        + '<td>' + (n.best != null ? n.best.toLocaleString() : '\u2013') + '</td>'
        + '<td>' + (n.finalized != null ? n.finalized.toLocaleString() : '\u2013') + '</td>'
        + '<td>' + (n.peers != null ? n.peers : '\u2013') + '</td>'
        + '<td>' + lagCell + '</td>'
        + '</tr>';
    }).join('');

    return '<div class="chain-block">'
      + '<div class="chain-head">'
      + '<span class="chain-dot relay-' + relay + '"></span>'
      + escapeHtml(label)
      + '<span class="chain-count">' + t.length + ' nodes · best ' + (c.bestBlock != null ? c.bestBlock.toLocaleString() : '\u2013') + (c.feedOk === false ? ' · FEED ERROR' : '') + '</span>'
      + '</div>'
      + '<div class="fullset-wrap" style="display:' + (isExp ? 'block' : 'none') + '" id="' + key + '">'
      + '<table class="fullset-table">'
      + '<thead><tr><th></th><th style="text-align:left">Node</th><th style="text-align:left">PeerID</th><th>Best</th><th>Finalized</th><th>Peers</th><th>Lag</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table></div>'
      + '<button class="fullset-btn" onclick="toggleChain(\'' + key + '\', this, ' + t.length + ')">'
      + (isExp ? '\u25BE Hide' : '\u25B8 Show all ' + t.length + ' nodes')
      + '</button>'
      + '</div>';
  }).join('');
}

function toggleChain(key, btn, total) {
  expandedChains[key] = !expandedChains[key];
  var wrap = document.getElementById(key);
  if (expandedChains[key]) {
    wrap.style.display = 'block';
    btn.innerHTML = '\u25BE Hide';
  } else {
    wrap.style.display = 'none';
    btn.innerHTML = '\u25B8 Show all ' + total + ' nodes';
  }
}

function shortPeer(p) { return p ? p.slice(0, 10) + '\u2026' + p.slice(-4) : '\u2013'; }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderAlert(nodes, feed) {
  var banner = document.getElementById('alertBanner');
  var offline = Object.values(nodes).filter(function(c) { return c.statusText === 'offline'; });
  if (feed && feed.error) {
    banner.innerHTML = '\u26A0 Telemetry feed problem: ' + escapeHtml(feed.error) + ' — offline detection paused.';
    banner.classList.add('show');
    return;
  }
  if (!offline.length) { banner.classList.remove('show'); return; }
  var names = offline.map(function(c) { return '<strong>' + escapeHtml(c.label || c.peerId) + '</strong> (' + escapeHtml(c.chain || '') + ')'; }).join(', ');
  banner.innerHTML = '\u26A0 ' + offline.length + ' node' + (offline.length > 1 ? 's are' : ' is') + ' OFFLINE: ' + names;
  banner.classList.add('show');
}

async function load() {
  try {
    var res = await fetch('status.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var nodes = data.nodes || {};
    var chains = data.chains || {};
    setIndicator(data.feed && data.feed.error ? 'error' : 'live');
    document.getElementById('topbarMeta').innerHTML =
      'Updated ' + ago(data.lastUpdated) + '<br>' + fmt(data.lastUpdated);
    renderStats(nodes, chains);
    renderCards(nodes);
    renderNodesTable(chains, nodes);
    renderAlert(nodes, data.feed);
  } catch (err) {
    setIndicator('error');
    document.getElementById('topbarMeta').textContent = 'fetch error';
    document.getElementById('cardList').innerHTML = '<div class="empty">Could not load status.json<br><span style="color:var(--amber);font-family:var(--mono);font-size:11px">' + err.message + '</span></div>';
  }
}

function startRefreshCycle() {
  clearInterval(countdownInterval);
  var sec = REFRESH_MS / 1000;
  var fill = document.getElementById('refreshFill');
  fill.style.width = '100%';
  countdownInterval = setInterval(function() {
    sec--;
    fill.style.width = Math.max(0, (sec / (REFRESH_MS / 1000)) * 100) + '%';
    if (sec <= 0) { clearInterval(countdownInterval); load().then(startRefreshCycle); }
  }, 1000);
}

load().then(startRefreshCycle);
</script>
</body>
</html>
